services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WORK_ROOT: /work
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL in .env; see .env.example}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env; see .env.example}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      JOB_TTL_SECONDS: "3600"
      MAX_UPLOAD_BYTES: "25000000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-12000}
      MAX_REPAIR_CONTEXT_CHARS: ${MAX_REPAIR_CONTEXT_CHARS:-24000}
      MAX_REPAIR_CHANGED_LINES: ${MAX_REPAIR_CHANGED_LINES:-200}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["jobs:/work"]
    networks: [inside, egress]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "10001:10001"

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8080"
    depends_on: [api, next]
    networks: [inside, edge]
    read_only: true
    tmpfs: ["/var/cache/nginx:size=16m,noexec,nosuid", "/var/run:size=1m,noexec,nosuid", "/tmp:size=16m,noexec,nosuid"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  next:
    build:
      context: ./frontend
      dockerfile: Dockerfile.next
      args:
        NEXT_PUBLIC_SPLINE_SCENE_URL: ${NEXT_PUBLIC_SPLINE_SCENE_URL:-}
    environment:
      NEXT_PUBLIC_SPLINE_SCENE_URL: ${NEXT_PUBLIC_SPLINE_SCENE_URL:-}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks: [inside]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "1000:1000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "worker.py"]
    environment:
      WORK_ROOT: /work
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL in .env; see .env.example}
      JOB_TTL_SECONDS: "3600"
      JOB_TIMEOUT_SECONDS: "90"
      ANALYSIS_MODE: ${ANALYSIS_MODE:-legacy}
      MAX_PROJECT_FILES: "5000"
      MAX_EXTRACTED_BYTES: "100000000"
    volumes: ["jobs:/work"]
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp:size=256m,noexec,nosuid"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    user: "10001:10001"

volumes:
  jobs:

networks:
  inside:
    internal: true
  egress:
  edge:
    driver: bridge
